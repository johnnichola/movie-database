<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie DB Homepage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="inner-body">
        <div id="search-panel">
            <h1>MovieDB - A Movie Database</h1>
            <p>Search HD movies, TV shows, new releases, and top IMDb titles in one clean place</p>
            <form action="/submit-data" method="POST">
                <input type="text" id="username" name="username" placeholder="Enter movies or a series name">
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>

    <script src="index.js" defer></script>
</body>
</html>
