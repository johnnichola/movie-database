<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav>
        <div style="display: flex; flex-direction: row; align-items: center; gap: 20px; width: 50%;">
            <h1>LOGO</h1>
            <div class="nav-buttons" style="display: flex; flex-direction: row; gap: 20px;">
                <button onclick="window.location.href='../index.html'">Home</button>
                <button onclick="goToTopMovies()">Top Movies</button>
                <button>TV Series</button>
            </div>
        </div>
        <div style="width: 50%;">
            <form style="width: 100%; display: flex; justify-content: flex-end; align-items: center" class="search-form">
                <input type="text" id="movieFieldNav" name="username" placeholder="Enter movies or a series name">
                <button type="button" class="submit-button" onclick="searchMovie()" style="font-weight: bold;">Search</button>
            </form>
        </div>
    </nav>

    <div id="center-body">
        <div id="inner-body">
            <div style="display: flex; justify-content: start; flex-direction: column;">
                <h1>Search Movies and TV Series</h1>
                <p>Search results for "<span id="result-title">movie title</span>"</p>
        
                <h3 style="color: #05B7CF">SEARCH MOVIES AND TV SERIES</h3>
            </div>
            <div class="grid-results">
            </div>
        </div>
    </div>

    <script src="../index.js" defer></script>
</body>
</html>
